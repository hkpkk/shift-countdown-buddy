<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐈‍⬛🐈 17:00</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff5f8;
    --card: #ffffff;
    --card-alt: #fceef3;
    --border: #f3c6d6;
    --border-rose: #e598b2;
    --rose-deep: #b84a6e;
    --rose-accent: #d96b90;
    --text-main: #4a2533;
    --muted: #8c5a6d;
    --sage-rose: #c95b82;
    --serif: 'EB Garamond', 'Libre Baskerville', 'Baskerville Old Face', 'Garamond', 'Georgia', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--serif);
    padding: 10px 12px;
    max-width: 325px;
    margin: 0 auto;
    letter-spacing: 0.2px;
  }
  #pipPlaceholder {
    display: none;
    text-align: center;
    padding: 24px 14px;
    border: 1px dashed var(--border-rose);
    border-radius: 8px;
    background: var(--card);
    color: var(--rose-deep);
    font-style: italic;
    font-size: 14px;
    cursor: pointer;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .clock {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    color: var(--rose-deep);
    font-size: 14.5px;
    letter-spacing: 0.5px;
  }
  .btn-group { display: flex; gap: 5px; }
  button {
    font-family: var(--serif);
    background: #ffffff;
    color: var(--rose-deep);
    border: 1px solid var(--border-rose);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    background: #fbe0ea;
    border-color: var(--rose-deep);
  }
  .main-card {
    background: var(--card);
    border-radius: 8px;
    padding: 10px 14px;
    border: 1px solid var(--border-rose);
    box-shadow: 0 2px 8px rgba(217, 107, 144, 0.08);
    margin-bottom: 7px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .title-classic {
    color: var(--rose-deep);
    font-style: italic;
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.6px;
  }
  .big-timer {
    font-family: 'Libre Baskerville', 'Baskerville Old Face', 'Garamond', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 1.2px;
  }
  .pct-classic {
    color: var(--sage-rose);
    font-style: italic;
    font-weight: 600;
    font-size: 13.5px;
  }
  .progress-bg {
    height: 5px;
    background: #f8dce6;
    border: 1px solid var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 7px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f497b6, #d96b90);
    transition: width 0.5s ease;
  }
  .lunch-row {
    background: var(--card-alt);
    border-radius: 6px;
    padding: 5px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    margin-bottom: 7px;
    border: 1px solid var(--border);
  }
  .lunch-label {
    color: var(--muted);
    font-style: italic;
  }
  .lunch-val {
    font-family: 'Libre Baskerville', 'Baskerville Old Face', 'Garamond', serif;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--rose-deep);
    letter-spacing: 0.6px;
  }
  .cat-couple-box {
    background: #ffffff;
    border: 1px solid var(--border-rose);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(217, 107, 144, 0.06);
    transition: transform 0.12s, border-color 0.2s;
  }
  .cat-couple-box:hover {
    border-color: var(--rose-deep);
    background: #fffbfd;
  }
  .cat-couple-box:active {
    transform: scale(0.985);
  }
  .cat-svg-wrap {
    flex-shrink: 0;
    width: 96px;
    height: 70px;
    position: relative;
  }
  .cat-speech-wrap {
    flex: 1;
  }
  .couple-names {
    font-size: 11px;
    letter-spacing: 0.8px;
    color: var(--rose-deep);
    font-weight: 700;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
  }
  .cat-speech {
    font-size: 13px;
    font-style: italic;
    color: var(--text-main);
    line-height: 1.3;
  }
  .heart-float {
    color: #e0537c;
    font-style: normal;
  }
  #appRoot.compact .extra-section { display: none; }
</style>
</head>
<body>
  <div id="pipPlaceholder" title="Bấm để thu cửa sổ nổi về lại tab này">
    📌 Đang ghim cửa sổ nổi ở góc màn hình!<br>
    <small>(Nhìn góc dưới bên phải màn hình — hoặc bấm vào đây để thu về)</small>
  </div>

  <div id="appRoot">
    <div class="top-bar">
      <div class="clock" id="lblClock">12:00:00</div>
      <div class="btn-group">
        <button id="btnPip" title="Bung cửa sổ nổi luôn nằm trên cùng">📌</button>
        <button id="btnCompact" title="Thu gọn / Mở rộng">▴</button>
      </div>
    </div>

    <div class="main-card">
      <div class="card-header">
        <span class="title-classic">17:00</span>
        <span class="pct-classic" id="lblPct">0.0%</span>
      </div>
      <div class="big-timer" id="lblHomeTimer">00:00:00</div>
    </div>

    <div class="extra-section" id="extraSection">
      <div class="progress-bg">
        <div class="progress-fill" id="barFill"></div>
      </div>

      <div class="lunch-row">
        <span class="lunch-label">12:00</span>
        <span class="lunch-val" id="lblLunchTimer">00:00:00</span>
      </div>

      <div class="cat-couple-box" id="catBox" title="Chạm nhẹ để xoa đầu đôi Mèo Cam béo & Mèo Đen điềm đạm">
        <div class="cat-svg-wrap">
          <svg viewBox="0 0 130 95" width="96" height="70" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="66" cy="87" rx="50" ry="5" fill="#f5d0de" opacity="0.6"/>
            <path d="M98 78 C 118 72, 122 44, 107 36 C 100 32, 98 42, 104 45" stroke="#23202a" stroke-width="5.5" stroke-linecap="round" fill="none"/>
            <path d="M22 76 C 5 68, 4 46, 17 42" stroke="#eb8634" stroke-width="8" stroke-linecap="round" fill="none"/>
            <path d="M12 58 L16 55 M10 49 L15 48" stroke="#c86419" stroke-width="2" stroke-linecap="round"/>

            <!-- MATURE BLACK CAT -->
            <path d="M62 85 C 58 56, 63 42, 78 42 C 94 42, 100 58, 97 85 Z" fill="#23202a"/>
            <path d="M72 49 Q78 55 84 49" stroke="#373342" stroke-width="2" fill="none"/>
            <polygon points="62,28 64,7 76,20" fill="#23202a"/>
            <polygon points="65,25 66,11 74,20" fill="#4a3540"/>
            <polygon points="84,20 97,6 97,28" fill="#23202a"/>
            <polygon points="86,20 95,11 94,25" fill="#4a3540"/>
            <ellipse cx="80" cy="30" rx="18" ry="15.5" fill="#282530"/>

            <ellipse cx="73" cy="29" rx="4.2" ry="3.6" fill="#f5c542"/>
            <ellipse cx="72" cy="29" rx="1.4" ry="3.2" fill="#18151c"/>
            <path d="M67.5 27.5 Q73 29.5 77.5 26.5" stroke="#282530" stroke-width="3.2" fill="none"/>
            <path d="M68 27.5 Q73 29.2 77.5 26.5" stroke="#141218" stroke-width="1.5" fill="none" stroke-linecap="round"/>

            <ellipse cx="87" cy="29" rx="4.2" ry="3.6" fill="#f5c542"/>
            <ellipse cx="86" cy="29" rx="1.4" ry="3.2" fill="#18151c"/>
            <path d="M82.5 26.5 Q87 29.5 92.5 27.5" stroke="#282530" stroke-width="3.2" fill="none"/>
            <path d="M82.5 26.5 Q87 29.2 92 27.5" stroke="#141218" stroke-width="1.5" fill="none" stroke-linecap="round"/>

            <polygon points="78.5,34 81.5,34 80,36" fill="#d97b93"/>
            <path d="M76 38 Q79 39.2 80 36.5 Q82.5 39.5 86.5 36.2" stroke="#8f869e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M86 35.2 L87.5 36.8" stroke="#8f869e" stroke-width="1.3" fill="none" stroke-linecap="round"/>

            <!-- CHUBBY ORANGE CAT -->
            <ellipse cx="40" cy="64" rx="25" ry="21" transform="rotate(-18 40 64)" fill="#f29441"/>
            <ellipse cx="45" cy="68" rx="14" ry="12" transform="rotate(-15 45 68)" fill="#fde3c8"/>
            <path d="M21 56 Q27 53 30 58" stroke="#c96518" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M18 65 Q25 62 28 67" stroke="#c96518" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <polygon points="30,30 33,14 44,24" fill="#eb8634"/>
            <polygon points="32,28 34,17 42,24" fill="#f7a8b8"/>
            <polygon points="52,22 62,12 63,28" fill="#eb8634"/>
            <polygon points="54,22 60,15 61,26" fill="#f7a8b8"/>
            <ellipse cx="48" cy="36" rx="19.5" ry="16" transform="rotate(-8 48 36)" fill="#f7a254"/>
            <circle cx="60" cy="39" r="9.5" fill="#f7a254"/>
            <circle cx="34" cy="40" r="8.5" fill="#f7a254"/>
            <path d="M43 23 L46 28 L49 24 L52 28 L55 23" stroke="#c96518" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

            <ellipse cx="69" cy="48" rx="7.5" ry="5" transform="rotate(15 69 48)" fill="#fff5eb" stroke="#e07b2d" stroke-width="1.2"/>
            <circle cx="72" cy="48" r="1.5" fill="#f48fb1"/>
            <circle cx="69" cy="45.5" r="1.2" fill="#f48fb1"/>
            <circle cx="69" cy="50.5" r="1.2" fill="#f48fb1"/>

            <ellipse cx="62" cy="57" rx="7.5" ry="5" transform="rotate(-10 62 57)" fill="#fff5eb" stroke="#e07b2d" stroke-width="1.2"/>
            <circle cx="65" cy="56.5" r="1.5" fill="#f48fb1"/>

            <path d="M38 35 Q42 30 45 35" stroke="#422412" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path d="M51 34 Q55 29 58 34" stroke="#422412" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <ellipse cx="36" cy="39" rx="3.5" ry="2" fill="#f06292" opacity="0.55"/>
            <ellipse cx="60" cy="37" rx="3.5" ry="2" fill="#f06292" opacity="0.55"/>
            <path d="M46 39 Q48 42 49.5 39 Q51 42 53 39" stroke="#422412" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <path d="M48 40.5 Q49.5 44 51 40.5" fill="#e0537c"/>

            <text id="svgHeart" x="64" y="13" text-anchor="middle" fill="#e0537c" font-size="14" font-family="Georgia, serif">♥</text>
          </svg>
        </div>
        <div class="cat-speech-wrap">
          <div class="couple-names">
            <span>🐈 &amp; 🐈‍⬛</span>
            <span class="heart-float" id="lblPetCount">✦</span>
          </div>
          <div class="cat-speech" id="catSpeech">“Chạm nhẹ xoa đầu hai đứa...”</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Cache all DOM elements up front so they keep working even when #appRoot moves to PiP window!
  const appRoot = document.getElementById('appRoot');
  const pipPlaceholder = document.getElementById('pipPlaceholder');
  const lblClock = document.getElementById('lblClock');
  const lblLunch = document.getElementById('lblLunchTimer');
  const lblHome = document.getElementById('lblHomeTimer');
  const lblPct = document.getElementById('lblPct');
  const barFill = document.getElementById('barFill');
  const svgHeart = document.getElementById('svgHeart');
  const catSpeech = document.getElementById('catSpeech');
  const lblPetCount = document.getElementById('lblPetCount');
  const catBox = document.getElementById('catBox');
  const btnCompact = document.getElementById('btnCompact');
  const btnPip = document.getElementById('btnPip');

  let activePipWin = null;
  let petCount = 0;

  const coupleDialogues = [
    "Mèo Đen: “Nặng quá đấy cục bông cam kia... nhưng thôi, cứ tựa vào đi.”",
    "Mèo Cam: “Ngồi thẳng lưng lên nào, thả lỏng hai vai cho đỡ mỏi nhé!”",
    "Mèo Đen: “Nhấp một ngụm nước ấm đi, giữ cho tâm trí luôn thư thái.”",
    "Mèo Cam: “Chiều trôi êm ả lắm, từng khắc đồng hồ đang nhẹ nhàng qua.”",
    "Mèo Đen: “Mỏi mắt rồi kìa, phóng tầm mắt ra xa mười giây nghỉ ngơi chút đi.”",
    "Mèo Cam: “Hít vào một hơi thật sâu, thở ra thật nhẹ, mọi việc đều ổn thỏa.”",
    "Mèo Đen: “Đừng quên ăn uống điều độ, hai đứa vẫn ngồi canh giờ cho bạn đây.”"
  ];

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    lblClock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    const shiftStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0);
    const lunchStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    const lunchEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 13, 0, 0);
    const shiftEnd   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 0, 0);

    if (now < lunchStart) {
      const diff = Math.floor((lunchStart - now) / 1000);
      const hh = Math.floor(diff / 3600);
      const mm = Math.floor((diff % 3600) / 60);
      const ss = diff % 60;
      lblLunch.textContent = `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
      lblLunch.style.color = '#b84a6e';
    } else if (now >= lunchStart && now < lunchEnd) {
      const diff = Math.floor((lunchEnd - now) / 1000);
      lblLunch.textContent = `00:${pad(Math.floor(diff/60))}:${pad(diff%60)}`;
      lblLunch.style.color = '#d96b90';
    } else {
      lblLunch.textContent = '00:00:00';
      lblLunch.style.color = '#8c5a6d';
    }

    if (now < shiftEnd) {
      const diff = Math.floor((shiftEnd - now) / 1000);
      const hh = Math.floor(diff / 3600);
      const mm = Math.floor((diff % 3600) / 60);
      const ss = diff % 60;
      lblHome.textContent = `${pad(hh)}:${pad(mm)}:${pad(ss)}`;

      const total = (shiftEnd - shiftStart) / 1000;
      const elapsed = Math.max(0, (now - shiftStart) / 1000);
      const pct = Math.min(100, (elapsed / total) * 100);
      lblPct.textContent = `${pct.toFixed(1)}%`;
      barFill.style.width = `${pct.toFixed(1)}%`;
    } else {
      lblHome.textContent = '00:00:00';
      lblPct.textContent = '100%';
      barFill.style.width = '100%';
    }

    svgHeart.setAttribute('y', (now.getSeconds() % 2 === 0) ? '12' : '15');

    if (petCount === 0 || now.getSeconds() % 20 === 0) {
      if (now.getHours() === 11 && now.getMinutes() >= 45) {
        catSpeech.textContent = '“Sắp tới giờ nghỉ trưa rồi, chuẩn bị thưởng thức bữa trưa ngon miệng nhé.”';
      } else if (now.getHours() === 15 && now.getMinutes() >= 20 && now.getMinutes() <= 50) {
        catSpeech.textContent = '“Giờ trà chiều điểm rồi — dùng chút đồ uống ấm hoặc bữa phụ nhẹ nhàng nhé!”';
      } else if (now.getHours() === 16 && now.getMinutes() >= 45) {
        catSpeech.textContent = '“Chỉ còn chưa đầy mười lăm phút nữa, thong thả thu xếp đồ đạc chuẩn bị về thôi!”';
      }
    }
  }

  catBox.addEventListener('click', () => {
    petCount++;
    lblPetCount.textContent = `♥ ×${petCount}`;
    catSpeech.textContent = coupleDialogues[petCount % coupleDialogues.length];
  });

  btnCompact.addEventListener('click', () => {
    const isComp = appRoot.classList.toggle('compact');
    btnCompact.textContent = isComp ? '▾' : '▴';
    const targetWin = activePipWin || window;
    try {
      targetWin.resizeTo(335, isComp ? 150 : 285);
    } catch (e) {}
  });

  pipPlaceholder.addEventListener('click', () => {
    if (activePipWin) {
      activePipWin.close();
    }
  });

  btnPip.addEventListener('click', async () => {
    if (activePipWin) {
      activePipWin.close();
      return;
    }
    if ('documentPictureInPicture' in window) {
      try {
        const pipWin = await window.documentPictureInPicture.requestWindow({ width: 335, height: 270 });
        activePipWin = pipWin;
        [...document.querySelectorAll('link[rel="stylesheet"], style')].forEach(node => {
          pipWin.document.head.appendChild(node.cloneNode(true));
        });
        pipPlaceholder.style.display = 'block';
        pipWin.document.body.appendChild(appRoot);
        pipWin.addEventListener('pagehide', () => {
          document.body.appendChild(appRoot);
          pipPlaceholder.style.display = 'none';
          activePipWin = null;
        });
      } catch (err) {
        window.open(location.href, 'ShiftBuddy', 'popup=yes,width=335,height=275');
      }
    } else {
      window.open(location.href, 'ShiftBuddy', 'popup=yes,width=335,height=275');
    }
  });

  setInterval(updateClock, 1000);
  updateClock();
</script>
</body>
</html>
